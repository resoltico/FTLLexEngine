name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-support:
    name: Resolve Python Support Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      minimum-version: ${{ steps.contract.outputs.minimum-version }}
      latest-version: ${{ steps.contract.outputs.latest-version }}
      supported-json: ${{ steps.contract.outputs.supported-json }}
      freethreaded-version: ${{ steps.contract.outputs.freethreaded-version }}
      unsupported-version: ${{ steps.contract.outputs.unsupported-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Export Python support contract
        id: contract
        run: python3 scripts/python_support.py github-outputs >> "$GITHUB_OUTPUT"

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: python-support
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UV_PROJECT_ENVIRONMENT: .venv-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-support.outputs.supported-json) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Verify shell syntax
        run: bash -n check.sh scripts/*.sh

      - name: Detect package name
        id: detect
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(find src -mindepth 1 -maxdepth 1 -type d -not -name "*.egg-info" -not -name "__pycache__" | head -n 1 | xargs basename)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package in src/"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected package: $PACKAGE_NAME"

      - name: Install dependencies
        run: |
          uv sync --group dev --locked
          echo "Locked environment synchronized"

      - name: Run Linters
        run: |
          echo "::group::Linting (target: Python ${{ matrix.python-version }})"
          PY_VERSION=${{ matrix.python-version }} uv run scripts/lint.sh
          echo "::endgroup::"

      - name: Verify lint left checkout unchanged
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Verification mutated the checkout"
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Run Tests
        run: |
          echo "::group::Testing"
          PY_VERSION=${{ matrix.python-version }} uv run scripts/test.sh --ci
          echo "::endgroup::"

      - name: Verify package import
        run: |
          PACKAGE="${{ steps.detect.outputs.name }}"
          uv run python -c "import ${PACKAGE}; print(f'Successfully imported ${PACKAGE} v{${PACKAGE}.__version__}')"

  test-freethreaded:
    name: Test (Python ${{ needs.python-support.outputs.freethreaded-version }})
    needs: python-support
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PY_VERSION: ${{ needs.python-support.outputs.freethreaded-version }}
      UV_PROJECT_ENVIRONMENT: .venv-${{ needs.python-support.outputs.freethreaded-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ needs.python-support.outputs.freethreaded-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ needs.python-support.outputs.freethreaded-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Verify shell syntax
        run: bash -n check.sh scripts/*.sh

      - name: Install dependencies
        run: |
          uv sync --group dev --locked --python "$PY_VERSION"
          echo "Locked free-threaded environment synchronized"

      - name: Run Tests
        run: |
          echo "::group::Free-threaded Testing"
          uv run scripts/test.sh --ci --quick
          echo "::endgroup::"
