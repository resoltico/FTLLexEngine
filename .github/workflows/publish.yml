name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, publish, or verify
        required: true
        type: string
      publish_to_testpypi:
        description: Also publish the tagged distribution to TestPyPI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publication-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Resolve Release Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      minimum-version: ${{ steps.python-support.outputs.minimum-version }}
      latest-version: ${{ steps.python-support.outputs.latest-version }}
      supported-json: ${{ steps.python-support.outputs.supported-json }}
      freethreaded-version: ${{ steps.python-support.outputs.freethreaded-version }}
      unsupported-version: ${{ steps.python-support.outputs.unsupported-version }}
      release-tag: ${{ steps.release-ref.outputs.release-tag }}
      release-version: ${{ steps.release-ref.outputs.release-version }}
      release-commit: ${{ steps.release-ref.outputs.release-commit }}
      tag-object-sha: ${{ steps.release-ref.outputs.tag-object-sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Export Python support contract
        id: python-support
        run: python3 scripts/python_support.py github-outputs >> "$GITHUB_OUTPUT"

      - name: Resolve immutable annotated release tag
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          release_tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          if re.fullmatch(r"v\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.]+)?", release_tag) is None:
              raise SystemExit(f"::error::Invalid release tag format: {release_tag}")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def fetch(url: str) -> dict[str, object]:
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:  # pragma: no cover - exercised in workflow
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"::error::Failed to fetch release metadata from {url}: "
                      f"{error.code} {detail}"
                  ) from error

          ref = fetch(f"https://api.github.com/repos/{repo}/git/ref/tags/{release_tag}")
          ref_object = ref.get("object", {})
          if ref_object.get("type") != "tag":
              raise SystemExit(
                  "::error::Release tags must be annotated tag objects; "
                  f"{release_tag} resolved to {ref_object.get('type')!r}"
              )

          tag_sha = str(ref_object.get("sha", ""))
          tag_object = fetch(f"https://api.github.com/repos/{repo}/git/tags/{tag_sha}")
          if tag_object.get("tag") != release_tag:
              raise SystemExit(
                  "::error::Resolved tag object does not match requested release tag"
              )

          target_object = tag_object.get("object", {})
          if target_object.get("type") != "commit":
              raise SystemExit(
                  "::error::Release tag must point to a commit object"
              )

          verification = tag_object.get("verification") or {}
          if not verification.get("verified"):
              reason = verification.get("reason", "unknown")
              raise SystemExit(
                  "::error::Release tag signature is not verified by GitHub "
                  f"(reason: {reason})"
              )

          commit_sha = str(target_object.get("sha", ""))
          if len(commit_sha) != 40:
              raise SystemExit("::error::Resolved release commit SHA is malformed")

          print(f"release-tag={release_tag}")
          print(f"release-version={release_tag.removeprefix('v')}")
          print(f"release-commit={commit_sha}")
          print(f"tag-object-sha={tag_sha}")
          PY

  build:
    name: Build & Verify Quality (Python ${{ matrix.python-version }})
    needs: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      UV_PROJECT_ENVIRONMENT: .venv-${{ matrix.python-version }}
      RELEASE_TAG: ${{ needs.release-contract.outputs.release-tag }}
      RELEASE_VERSION: ${{ needs.release-contract.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.release-contract.outputs.release-commit }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.release-contract.outputs.supported-json) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working directory is not clean after checkout"
            git status --short
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo "::error::Checked out commit does not match resolved release commit"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Verify shell syntax
        run: bash -n check.sh scripts/*.sh

      - name: Detect package name
        id: detect
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(find src -mindepth 1 -maxdepth 1 -type d -not -name "*.egg-info" -not -name "__pycache__" | head -n 1 | xargs basename)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package in src/"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "Detected package: $PACKAGE_NAME"

      - name: Validate version tag
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Resolved tag version: $RELEASE_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version $RELEASE_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          uv sync --group dev --group release --locked
          echo "Locked environment synchronized"

      - name: Validate runtime version matches tag
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          RUNTIME_VERSION=$(uv run python -c "import ${PACKAGE}; print(${PACKAGE}.__version__)")
          if [ "$RUNTIME_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Runtime version $RUNTIME_VERSION doesn't match tag $RELEASE_VERSION"
            echo "::error::Update __version__ in src/${PACKAGE}/__init__.py"
            exit 1
          fi

      - name: Run Quality Checks (Lint & Test)
        run: |
          echo "::group::Linting"
          PY_VERSION=${{ matrix.python-version }} uv run scripts/lint.sh
          echo "::endgroup::"

          echo "::group::Testing"
          PY_VERSION=${{ matrix.python-version }} uv run scripts/test.sh --ci
          echo "::endgroup::"

      - name: Verify quality gates left checkout unchanged
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Verification mutated the checkout"
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build package
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        run: uv build

      - name: Check package metadata
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        run: uv run twine check dist/*

      - name: Verify package integrity
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"

          echo "Verifying package: $PACKAGE"

          set +o pipefail
          if ! unzip -l dist/*.whl | grep -q "${PACKAGE}/__init__.py"; then
            set -o pipefail
            echo "::error::Wheel missing ${PACKAGE}/__init__.py"
            exit 1
          fi
          set -o pipefail

          set +o pipefail
          if unzip -l dist/*.whl | grep -qE "\.pyc$|__pycache__"; then
            set -o pipefail
            echo "::error::Wheel contains compiled Python files"
            exit 1
          fi
          set -o pipefail

          set +o pipefail
          if ! tar -tzf dist/*.tar.gz | grep -q "src/${PACKAGE}/__init__.py"; then
            set -o pipefail
            echo "::error::Source distribution missing src/${PACKAGE}/__init__.py"
            exit 1
          fi
          set -o pipefail

          set +o pipefail
          if unzip -l dist/*.whl | grep -qE '(^|[[:space:]])AGENTS\.md$|(^|[[:space:]])\.codex/'; then
            set -o pipefail
            echo "::error::Wheel unexpectedly contains AGENTS.md or .codex/"
            exit 1
          fi
          set -o pipefail

          set +o pipefail
          if tar -tzf dist/*.tar.gz | grep -qE '(^|/)AGENTS\.md$|(^|/)\.codex/'; then
            set -o pipefail
            echo "::error::Source distribution unexpectedly contains AGENTS.md or .codex/"
            exit 1
          fi
          set -o pipefail

          echo "Package integrity verified"

      - name: Create release checksum receipt
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          VERSION="$RELEASE_VERSION"

          cd dist
          shasum -a 256 \
            "${PACKAGE}-${VERSION}.tar.gz" \
            "${PACKAGE}-${VERSION}-py3-none-any.whl" \
            > "${PACKAGE}-${VERSION}.sha256"

      - name: Debug Artifacts
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        run: ls -laR dist/

      - name: Stage publication artifacts
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        run: |
          set -euo pipefail
          mkdir -p publish-dist release-assets-dist
          cp dist/*.tar.gz dist/*.whl publish-dist/
          cp dist/*.tar.gz dist/*.whl dist/*.sha256 release-assets-dist/

          echo "PyPI distributions:"
          ls -la publish-dist/
          echo ""
          echo "GitHub release assets:"
          ls -la release-assets-dist/

          pypi_count="$(find publish-dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          release_count="$(find release-assets-dist -maxdepth 1 -type f | wc -l | tr -d ' ')"

          [ "${pypi_count}" = "2" ] || {
            echo "::error::Expected 2 uploadable distributions, found ${pypi_count}"
            exit 1
          }
          [ "${release_count}" = "3" ] || {
            echo "::error::Expected 3 GitHub release assets, found ${release_count}"
            exit 1
          }

      - name: Store PyPI distributions
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: publish-dist/
          retention-days: 7
          if-no-files-found: error

      - name: Store GitHub release assets
        if: matrix.python-version == needs.release-contract.outputs.latest-version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets-dist/
          retention-days: 7
          if-no-files-found: error

  verify-freethreaded:
    name: Verify Free-Threaded Python (${{ needs.release-contract.outputs.freethreaded-version }})
    needs: release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PY_VERSION: ${{ needs.release-contract.outputs.freethreaded-version }}
      UV_PROJECT_ENVIRONMENT: .venv-${{ needs.release-contract.outputs.freethreaded-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Set up Python ${{ needs.release-contract.outputs.freethreaded-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ needs.release-contract.outputs.freethreaded-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Install dependencies
        run: |
          uv sync --group dev --locked --python "$PY_VERSION"
          echo "Locked free-threaded environment synchronized"

      - name: Run free-threaded test suite
        run: |
          echo "::group::Free-threaded Testing"
          uv run scripts/test.sh --ci --quick
          echo "::endgroup::"

  test-publish:
    needs: [build, verify-freethreaded]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  verify-test-publish:
    name: Verify TestPyPI Publication
    needs: [release-contract, test-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.release-contract.outputs.supported-json) }}
    env:
      RELEASE_TAG: ${{ needs.release-contract.outputs.release-tag }}
      RELEASE_VERSION: ${{ needs.release-contract.outputs.release-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Detect package name
        id: detect
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(find src -mindepth 1 -maxdepth 1 -type d -not -name "*.egg-info" -not -name "__pycache__" | head -n 1 | xargs basename)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package in src/"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected package: $PACKAGE_NAME"

      - name: Wait for TestPyPI CDN propagation
        run: |
          echo "Waiting 60 seconds for TestPyPI CDN to propagate..."
          sleep 60

      - name: Install from TestPyPI with retry
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"

          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=20

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Installing ${PACKAGE}==${RELEASE_VERSION}..."
            pip cache purge || true
            if pip install --no-cache-dir --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "${PACKAGE}==${RELEASE_VERSION}"; then
              echo "Successfully installed ${PACKAGE}==${RELEASE_VERSION}"
              break
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "::error::Failed to install from TestPyPI after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            sleep $DELAY
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done

      - name: Verify installed version
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          INSTALLED_VERSION=$(python -c "import ${PACKAGE}; print(${PACKAGE}.__version__)")
          echo "Installed version: $INSTALLED_VERSION"
          echo "Expected version: $RELEASE_VERSION"
          if [ "$INSTALLED_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Version mismatch: $INSTALLED_VERSION != $RELEASE_VERSION"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          python -c "import ${PACKAGE} as pkg; r = pkg.parse_ftl('greeting = Hello, World!'); s = pkg.serialize_ftl(r); assert 'greeting' in s; print('Smoke test passed: ${PACKAGE} v' + pkg.__version__)"

  publish-release-assets:
    name: Publish GitHub Release Assets
    needs: [release-contract, build, verify-freethreaded]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-contract.outputs.release-tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/

      - name: Publish GitHub release assets
        run: ./scripts/publish-github-release-assets.sh "$RELEASE_TAG"

  verify-github-release:
    name: Verify GitHub Release
    needs: [release-contract, publish-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-contract.outputs.release-tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Verify GitHub release handoff
        run: ./scripts/verify-github-release.sh "$RELEASE_TAG"

  publish:
    needs: [build, verify-freethreaded]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true
          skip-existing: true

  verify-publish:
    name: Verify PyPI Publication
    needs: [release-contract, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.release-contract.outputs.supported-json) }}
    env:
      RELEASE_TAG: ${{ needs.release-contract.outputs.release-tag }}
      RELEASE_VERSION: ${{ needs.release-contract.outputs.release-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Detect package name
        id: detect
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(find src -mindepth 1 -maxdepth 1 -type d -not -name "*.egg-info" -not -name "__pycache__" | head -n 1 | xargs basename)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package in src/"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected package: $PACKAGE_NAME"

      - name: Wait for PyPI CDN propagation
        run: |
          echo "Waiting 90 seconds for PyPI CDN..."
          sleep 90

      - name: Install from PyPI with retry
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"

          MAX_ATTEMPTS=5
          ATTEMPT=1
          DELAY=30

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Installing ${PACKAGE}==${RELEASE_VERSION}..."
            pip cache purge || true
            if pip install --no-cache-dir "${PACKAGE}==${RELEASE_VERSION}"; then
              echo "Successfully installed ${PACKAGE}==${RELEASE_VERSION}"
              break
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "::error::Failed to install from PyPI after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            sleep $DELAY
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done

      - name: Verify installed version
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          INSTALLED_VERSION=$(python -c "import ${PACKAGE}; print(${PACKAGE}.__version__)")
          echo "Installed version: $INSTALLED_VERSION"
          echo "Expected version: $RELEASE_VERSION"
          if [ "$INSTALLED_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Version mismatch: $INSTALLED_VERSION != $RELEASE_VERSION"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          python -c "import ${PACKAGE} as pkg; r = pkg.parse_ftl('greeting = Hello, World!'); s = pkg.serialize_ftl(r); assert 'greeting' in s; print('Smoke test passed: ${PACKAGE} v' + pkg.__version__)"

  verify-python-requirement:
    name: Verify Python Requirement Floor
    needs: [release-contract, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.release-contract.outputs.release-version }}
      UNSUPPORTED_VERSION: ${{ needs.release-contract.outputs.unsupported-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.release-contract.outputs.release-commit }}

      - name: Detect package name
        id: detect
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(find src -mindepth 1 -maxdepth 1 -type d -not -name "*.egg-info" -not -name "__pycache__" | head -n 1 | xargs basename)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "::error::Could not detect package in src/"
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected package: $PACKAGE_NAME"

      - name: Set up Python ${{ env.UNSUPPORTED_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.UNSUPPORTED_VERSION }}

      - name: Verify install is blocked below the support floor
        run: |
          set -euo pipefail
          PACKAGE="${{ steps.detect.outputs.name }}"
          echo "Attempting to install $PACKAGE==$RELEASE_VERSION on Python $UNSUPPORTED_VERSION (should fail)..."
          if pip install --no-cache-dir "${PACKAGE}==${RELEASE_VERSION}" 2>/dev/null; then
            echo "::error::Installation succeeded below the supported Python floor"
            echo "::error::Check requires-python in pyproject.toml"
            exit 1
          fi
          echo "Installation correctly blocked on Python $UNSUPPORTED_VERSION"
